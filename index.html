<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Comanda · Man-o-Salwa</title>

<!-- ===== PWA: para poder "Añadir a pantalla de inicio" en móvil/tablet
     y que se abra a pantalla completa, sin la barra del navegador ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e30613">
<!-- iOS / Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Man-o-Salwa">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192-any.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:opsz,wght@9..40,400..800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (sincronización entre dispositivos) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    /* Paleta de manosalwa.es */
    color-scheme: light;
    --ink:#fff9ee;        /* fondo crema */
    --ink-2:#f5eddf;
    --ink-3:#ffffff;
    --paper:#ffffff;
    --paper-2:#f5eddf;
    --paper-line: #e5dccf;
    --stamp:#e30613;      /* rojo */
    --stamp-dark:#b6000b;
    --gold:#b6000b;       /* acento de texto (rojo oscuro, legible sobre crema) */
    --gold-soft: rgba(var(--accent-rgb),0.25);
    --yellow:#ffc536;
    --border:#e5dccf;
    --text-hi: #201a16;
    --text-lo: #71685f;
    --text-ink-hi: #201a16;
    --text-ink-lo: #71685f;
    --radius: 16px;
    --shadow: 0 18px 35px rgba(76,39,24,0.10);
    --font-display: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
    --wood-1:#fff; --wood-2:#fff;
    --wood-busy-1:#e30613; --wood-busy-2:#b6000b;
    --wood-chair-1:#e5dccf; --wood-chair-2:#e5dccf;
    --deco-1:#ffc536; --deco-2:#f0ad00;
    --barra-1:#fff; --barra-2:#f5eddf;
    --barra-busy-1:#e30613; --barra-busy-2:#b6000b;
    --badge-1:#ffc536; --badge-2:#ffc536; --badge-text:#201a16;
    --btn-accent-1:#ffc536; --btn-accent-2:#ffc536; --btn-accent-text:#201a16;
    --floor-1:#fff9ee; --floor-2:#fff9ee;
    --card:#ffffff;
    --line:32,26,22;
    --accent-rgb:227,6,19;
    --bar-bg:rgba(255,249,238,0.96);
    --tile-bg:#fff9ee; --tile-border:#201a16;
    --on-yellow:#201a16;
    --radius-tile:20px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background-color: var(--ink);
    background-image:
      radial-gradient(1200px 600px at 15% -10%, var(--ink-2) 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, var(--ink-3) 0%, transparent 55%);
    color:var(--text-hi);
    font-family:'DM Sans','Segoe UI',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  button, .mesa-tile, .barra-seat, .cat-btn, .lang-btn, .session-chip{touch-action:manipulation;}
  input, textarea{font-size:16px;} /* evita el zoom automático de iOS al enfocar */
  .display{font-family:var(--font-display);}
  button{font-family:inherit;}
  input{font-family:inherit;}

  /* ---------- App shell ---------- */
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  [hidden]{display:none !important;}

  .topbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
    padding:16px 20px;
    padding-top:calc(16px + env(safe-area-inset-top));
    border-bottom:1px solid rgba(var(--line),0.08);
    position:sticky;top:0;z-index:20;
    background:var(--bar-bg);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    background:var(--stamp);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:800;color:var(--text-hi);
    font-size:15px; letter-spacing:0;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15);
    flex:none;
  }
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:0.02em;}
  .brand small{color:var(--text-lo);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;}

  .lang-switch{display:flex;gap:6px;flex:none;}
  .sync-badge{
    margin-left:auto;flex:none;
    font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:20px;
    border:1px solid rgba(var(--line),.16);color:var(--text-lo);white-space:nowrap;
  }
  .sync-badge.on{color:#8fd39e;border-color:rgba(143,211,158,.35);background:rgba(143,211,158,.08);}
  .sync-badge.off{color:#e0b064;border-color:rgba(224,176,100,.35);background:rgba(224,176,100,.08);}

  .session-chip{
    display:flex;align-items:center;gap:4px;
    background:transparent;border:1px solid rgba(var(--line),0.16);
    color:var(--text-lo);padding:6px 12px;border-radius:20px;
    font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .session-chip b{color:var(--gold);font-weight:800;}
  .session-chip:hover{border-color:var(--gold-soft);color:var(--text-hi);}
  #connect-drawer-btn.drawer-on{color:#8fd39e;border-color:rgba(143,211,158,.35);background:rgba(143,211,158,.08);}
  #connect-drawer-btn.drawer-off{color:#e0b064;border-color:rgba(224,176,100,.35);background:rgba(224,176,100,.08);}
  #connect-drawer-btn.drawer-error{color:#e08a7a;border-color:rgba(224,138,122,.4);background:rgba(224,138,122,.1);}

  /* ---------- Login: código de sesión ---------- */
  #login-view{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:30px 22px;
    background-color: var(--ink);
  }
  .login-wrap{max-width:520px;width:100%;text-align:center;}
  .login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:8px;}
  .login-brand .mark{
    width:54px;height:54px;border-radius:50%;
    background:var(--stamp);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:800;color:var(--text-hi);
    font-size:24px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15), var(--shadow);
  }
  .login-brand h1{font-family:var(--font-display);font-size:28px;margin:0;font-weight:700;}
  .login-sub{color:var(--text-lo);font-size:13.5px;line-height:1.5;max-width:360px;margin:0 auto 30px;}
  .login-form{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .session-input{
    width:220px;
    background:rgba(var(--line),0.05);
    border:2px solid rgba(var(--line),0.16);
    border-radius:14px;
    color:var(--text-hi);
    font-family:var(--font-display);
    font-size:32px;font-weight:700;
    letter-spacing:0.5em;
    text-align:center;
    padding:16px 10px 16px 20px;
    outline:none;
  }
  .session-input::placeholder{color:rgba(var(--line),0.25);letter-spacing:0.5em;}
  .session-input:focus{border-color:var(--gold);}
  .session-submit{
    background:linear-gradient(160deg,var(--btn-accent-1),var(--btn-accent-2));
    color:var(--btn-accent-text);border:none;border-radius:30px;
    font-weight:800;font-size:14px;letter-spacing:0.03em;
    padding:12px 34px;cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .session-submit:active{transform:translateY(1px);}
  .login-error{
    color:#e8a49c;font-size:12.5px;font-weight:600;margin-top:16px;
  }
  .login-form.shake{animation:shakeInput .3s;}
  @keyframes shakeInput{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }
  .lang-btn{
    display:flex;align-items:center;gap:6px;
    background:transparent;border:1px solid rgba(var(--line),0.16);
    color:var(--text-lo);padding:6px 10px 6px 6px;border-radius:20px;
    font-size:11px;font-weight:700;letter-spacing:0.03em;cursor:pointer;
    transition:.15s;
  }
  .lang-btn:hover{border-color:var(--gold-soft);color:var(--text-hi);}
  .lang-btn.active{border-color:var(--gold);background:rgba(var(--accent-rgb),0.12);color:var(--gold);}

  /* ---------- Selector de rol: Cocina / Pizza / Comanda ---------- */
  .role-switch{display:flex;gap:6px;flex:none;}
  .role-btn{
    display:flex;align-items:center;gap:6px;
    background:transparent;border:1px solid rgba(var(--line),0.16);
    color:var(--text-lo);padding:7px 14px;border-radius:20px;
    font-size:11.5px;font-weight:800;letter-spacing:0.03em;cursor:pointer;
    transition:.15s;
  }
  .role-btn:hover{border-color:var(--gold-soft);color:var(--text-hi);}
  .role-btn.active{color:var(--text-hi);}
  .role-btn.active[data-role="comanda"]{border-color:var(--gold);background:rgba(var(--accent-rgb),0.16);color:var(--gold);}
  .role-btn.active[data-role="cocina"]{border-color:#e0895a;background:rgba(224,137,90,0.18);color:#f0a97e;}
  .role-btn.active[data-role="pizza"]{border-color:#5aa9a3;background:rgba(90,169,163,0.18);color:#8fd6cd;}
  .role-btn.active[data-role="postre"]{border-color:#d68fc9;background:rgba(214,143,201,0.18);color:#eab4de;}
  .role-btn.active[data-role="caja"]{border-color:#7fd48a;background:rgba(127,212,138,0.18);color:#a8e8b0;}

  /* ---------- Vista de cocina / pizza ---------- */
  #kitchen-view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .kitchen-topbar{justify-content:space-between;}
  .kitchen-body{flex:1;padding:18px 20px 60px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;max-width:820px;margin:0 auto;width:100%;}
  .kitchen-empty{color:var(--text-lo);text-align:center;padding:80px 20px;font-size:15px;}
  .kitchen-table-card{
    background:linear-gradient(180deg, var(--ink-2), var(--ink-3));
    border:1px solid rgba(var(--line),0.1);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .kitchen-table-head{
    padding:12px 16px;
    font-family:var(--font-display);font-weight:700;font-size:15px;
    background:rgba(var(--line),0.04);
    border-bottom:1px solid rgba(var(--line),0.08);
    display:flex;align-items:center;justify-content:space-between;
    color:var(--text-hi);
  }
  .kitchen-table-head .kth-pending{color:var(--gold);font-size:12px;font-weight:700;}
  .kitchen-line{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;
    border-bottom:1px solid rgba(var(--line),0.06);
  }
  .kitchen-line:last-child{border-bottom:none;}
  .kitchen-line.done{opacity:0.45;}
  .kitchen-line .kl-info{flex:1;min-width:0;}
  .kitchen-line .kl-name{font-size:15.5px;font-weight:700;color:var(--text-hi);}
  .kitchen-line.done .kl-name{text-decoration:line-through;}
  .kitchen-line .kl-qty{color:var(--gold);font-weight:800;margin-right:6px;}
  .kitchen-line .kl-note{display:block;font-size:12px;color:var(--text-lo);margin-top:3px;}
  .kl-tick{
    flex:none;width:42px;height:42px;border-radius:50%;
    border:2px solid rgba(var(--line),0.25);
    background:transparent;color:transparent;
    font-size:19px;font-weight:800;cursor:pointer;transition:.15s;
  }
  .kl-tick:active{transform:scale(0.92);}
  .kitchen-line.done .kl-tick{
    background:#3fae5c;border-color:#3fae5c;color:#fff;
  }
  .flag{width:18px;height:13px;border-radius:2px;flex:none;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.25);}
  .flag-es{background:linear-gradient(#c60b1e 0 25%, #ffc400 25% 75%, #c60b1e 75% 100%);}
  .flag-pk{background:linear-gradient(90deg,#fff 0 26%, #01411c 26% 100%);}
  .flag-pk::after{content:"☪";position:absolute;right:2px;top:-2px;font-size:10px;color:#fff;line-height:1;}
  .flag-en{
    background:#012169;
    background-image:
      linear-gradient(45deg, transparent 44%, #fff 44% 56%, transparent 56%),
      linear-gradient(-45deg, transparent 44%, #fff 44% 56%, transparent 56%),
      linear-gradient(transparent 38%, #fff 38% 62%, transparent 62%),
      linear-gradient(90deg, transparent 40%, #fff 40% 60%, transparent 60%),
      linear-gradient(transparent 42%, #c8102e 42% 58%, transparent 58%),
      linear-gradient(90deg, transparent 44%, #c8102e 44% 56%, transparent 56%);
  }

  /* ---------- Home: plano de sala ---------- */
  #home-view{padding:18px 22px 0;padding-bottom:env(safe-area-inset-bottom);max-width:1500px;margin:0 auto;width:100%;display:flex;flex-direction:column;flex:1;min-height:0;}
  .home-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .home-head .eyebrow{
    color:var(--gold);letter-spacing:0.24em;text-transform:uppercase;font-size:10.5px;font-weight:600;
  }
  .home-head h2{
    font-family:var(--font-display);font-weight:700;font-size:22px;margin:3px 0 0;
  }
  .legend{display:flex;gap:16px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-lo);}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .legend i.free{background:#5b5044;border:1px solid rgba(var(--line),0.25);}
  .legend i.busy{background:var(--stamp);}
  .legend i.barra{background:#4a4038;border:1px solid var(--gold-soft);border-radius:50%;}

  /* floor */
  .floor-wrap{
    flex:1;min-height:0;overflow:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    border:1px solid rgba(var(--line),0.1);
    border-radius:10px;
    background-color: var(--floor-1);
    background-image:
      linear-gradient(rgba(var(--line),0.05) 1px, transparent 1px) 0 0/100px 100px,
      linear-gradient(90deg, rgba(var(--line),0.05) 1px, transparent 1px) 0 0/100px 100px,
      radial-gradient(1200px 500px at 30% 0%, var(--floor-2) 0%, transparent 60%);
    padding:20px;
  }
  .floor{
    position:relative;
    display:grid;
    grid-template-columns:repeat(13, minmax(64px,1fr));
    grid-auto-rows:78px;
    gap:6px;
    min-width:920px;
  }
  .deco-bar{
    border-radius:5px;
    background:
      repeating-linear-gradient(100deg, rgba(0,0,0,0.06) 0 3px, transparent 3px 9px),
      linear-gradient(160deg, var(--deco-1) 0%, var(--deco-2) 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2), 0 6px 14px rgba(0,0,0,0.35);
    opacity:0.9;
  }
  .barra-seat{
    grid-row:1;
    width:52px;height:52px;border-radius:50%;
    align-self:center; justify-self:center;
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;color:var(--text-hi);
    background:radial-gradient(circle at 34% 30%, var(--barra-1) 0%, var(--barra-2) 75%);
    border:2px solid rgba(var(--line),0.16);
    cursor:pointer;transition:.15s;
  }
  .barra-seat:hover{border-color:var(--gold-soft);transform:translateY(-2px);}
  .barra-seat.busy{
    border-color:var(--stamp);
    background:radial-gradient(circle at 34% 30%, var(--barra-busy-1) 0%, var(--barra-busy-2) 75%);
    box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.18);
  }

  .mesa-tile{
    position:relative;
    align-self:center; justify-self:center;
    width:100%; height:56px;
    display:flex;align-items:center;justify-content:center;
    gap:4px;
    cursor:pointer;
  }
  .mesa-tile.big{
    transform:scale(1.4);
    z-index:4;
  }
  .mesa-tile .chair{
    width:9px;height:20px;flex:none;
    background:linear-gradient(160deg,var(--wood-chair-1),var(--wood-chair-2));
    border:1px solid rgba(0,0,0,0.25);
    border-radius:2px;
  }
  .mesa-tile .top{
    flex:1;height:100%;position:relative;
    border-radius:4px;
    background:linear-gradient(160deg, var(--wood-1) 0%, var(--wood-2) 100%);
    border:1px solid rgba(0,0,0,0.3);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.3);
    transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .mesa-tile:hover .top{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.07), 0 8px 16px rgba(0,0,0,0.4);}
  .mesa-tile .plate{
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, #d8cfb9 80%);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.15);
    display:none;
  }
  .mesa-tile.busy .top{
    background:linear-gradient(160deg, var(--wood-busy-1) 0%, var(--wood-busy-2) 100%);
    box-shadow:0 0 0 2px rgba(var(--accent-rgb),0.4), 0 6px 14px rgba(0,0,0,0.4);
  }
  .mesa-tile.busy .plate{display:block;}
  .mesa-badge{
    position:absolute;top:-11px;left:-8px;
    background:linear-gradient(160deg,var(--badge-1),var(--badge-2));
    color:var(--badge-text);
    font-size:11px;font-weight:800;
    width:24px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
    z-index:2;
  }
  .mesa-tile.busy .mesa-badge{
    background:linear-gradient(160deg,var(--stamp),var(--stamp-dark));
    color:var(--text-hi);
  }
  .mesa-total{
    position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
    font-size:9.5px;font-weight:700;color:var(--gold);white-space:nowrap;
  }

  /* toolbar */
  .floor-toolbar{
    display:flex;align-items:stretch;gap:10px;
    padding:14px 0 20px;flex-wrap:wrap;
  }
  .status-key{
    display:flex;flex-direction:column;justify-content:center;gap:4px;
    background:rgba(var(--line),0.04);border:1px solid rgba(var(--line),0.1);
    border-radius:8px;padding:8px 14px;font-size:10.5px;
  }
  .status-key div{display:flex;align-items:center;gap:7px;color:var(--text-lo);}
  .status-key div b{color:var(--text-hi);font-weight:600;}
  .status-key .sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .toolbar-btns{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
  .tb-btn{
    flex:1;min-width:120px;
    background:linear-gradient(160deg,var(--btn-accent-1),var(--btn-accent-2));
    color:var(--btn-accent-text);border:none;border-radius:8px;
    font-weight:800;font-size:12px;letter-spacing:0.03em;
    padding:0 14px;cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .tb-btn:active{transform:translateY(1px);}
  .tb-btn.ghost{
    background:rgba(var(--line),0.06);color:var(--text-hi);
    border:1px solid rgba(var(--line),0.16);
    box-shadow:none;font-weight:600;
  }
  .tb-btn.danger{
    background:linear-gradient(160deg,#c65a4a,#8f2c22);
    color:#f6efe1;
    box-shadow:0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15);
  }

  /* ---------- Table / comanda view ---------- */
  #table-view{flex:1;display:flex;flex-direction:column;min-height:0;}
  .table-topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .back-btn{
    display:flex;align-items:center;gap:6px;
    background:transparent;border:1px solid rgba(var(--line),0.18);
    color:var(--text-hi);padding:9px 14px;border-radius:30px;
    font-size:13px;cursor:pointer;transition:.15s;
  }
  .back-btn:hover{border-color:var(--gold-soft);}
  .table-title{display:flex;align-items:center;gap:10px;}
  .table-title .num{
    font-family:var(--font-display);font-weight:800;font-size:22px;
    background:var(--stamp);width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .table-title h2{margin:0;font-size:18px;font-weight:700;}

  .search-wrap{
    flex:1;min-width:220px;position:relative;
  }
  .search-wrap input{
    width:100%;
    background:rgba(var(--line),0.06);
    border:1px solid rgba(var(--line),0.16);
    color:var(--text-hi);
    padding:11px 16px 11px 38px;
    border-radius:30px;
    font-size:14px;
    outline:none;
  }
  .search-wrap input::placeholder{color:var(--text-lo);}
  .search-wrap input:focus{border-color:var(--gold);}
  .search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:0.5;}

  .table-actions{display:flex;gap:8px;flex:none;}
  .variable-btn{
    flex:none;display:flex;align-items:center;gap:6px;
    background:linear-gradient(160deg,var(--btn-accent-1),var(--btn-accent-2));
    color:var(--btn-accent-text);border:none;border-radius:20px;
    font-weight:800;font-size:12.5px;letter-spacing:0.02em;
    padding:10px 16px;cursor:pointer;white-space:nowrap;
    box-shadow:0 3px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .variable-btn:active{transform:translateY(1px);}
  .pay-btn{
    background:linear-gradient(160deg,#7fae6f,#4f7d43);
    border:1px solid rgba(0,0,0,0.15);
    color:#f4ede1;padding:9px 16px;border-radius:30px;
    font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .pay-btn:hover{filter:brightness(1.08);}
  .park-btn-top{
    background:rgba(var(--accent-rgb),0.14);border:1px solid var(--gold-soft);
    color:var(--gold);padding:9px 14px;border-radius:30px;
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .park-btn-top:hover{background:rgba(var(--accent-rgb),0.22);}
  .print-btn-top{
    background:rgba(90,169,163,0.14);border:1px solid rgba(90,169,163,0.4);
    color:#8fd6cd;padding:9px 14px;border-radius:30px;
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .print-btn-top:hover{background:rgba(90,169,163,0.22);}
  .clear-mesa-btn{
    background:transparent;border:1px solid rgba(var(--accent-rgb),0.4);
    color:#e8a49c;padding:9px 14px;border-radius:30px;font-size:13px;cursor:pointer;
  }
  .clear-mesa-btn:hover{background:rgba(var(--accent-rgb),0.12);}

  .table-body{
    flex:1;display:flex;min-height:0;
  }

  /* category rail */
  .cat-rail{
    width:190px;flex:none;
    border-right:1px solid rgba(var(--line),0.08);
    overflow-y:auto;
    padding:14px 10px 40px;
  }
  .cat-btn{
    width:100%;text-align:left;
    background:transparent;border:none;color:var(--text-lo);
    padding:9px 12px;border-radius:9px;font-size:13px;
    cursor:pointer;margin-bottom:2px;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
    transition:.15s;
  }
  .cat-btn:hover{background:rgba(var(--line),0.05);color:var(--text-hi);}
  .cat-btn.active{background:rgba(var(--accent-rgb),0.14);color:var(--gold);font-weight:600;}
  .cat-group-label{
    font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(var(--line),0.32);
    padding:14px 12px 4px;
  }
  .cat-group-label:first-child{padding-top:4px;}

  /* items area */
  .items-area{
    flex:1;overflow-y:auto;padding:20px 22px 40px;
  }
  .items-heading{
    font-family:var(--font-display);font-size:20px;font-weight:700;margin:0 0 4px;
  }
  .items-sub{color:var(--text-lo);font-size:12.5px;margin:0 0 16px;}
  .item-row{
    color-scheme: light;
    display:flex;align-items:center;gap:14px;
    background:var(--paper);
    border:1px solid var(--paper-2);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .item-row.in-order{border-color:var(--stamp);box-shadow:0 0 0 2px rgba(var(--accent-rgb),0.15), 0 2px 6px rgba(0,0,0,0.15);}
  .item-info{flex:1;min-width:0;}
  .item-info .name{font-size:14.5px;font-weight:700;color:#000;}
  .item-info .name .cat-pill{
    font-size:9.5px;font-weight:600;color:var(--stamp-dark);
    border:1px solid rgba(var(--accent-rgb),0.35);border-radius:20px;padding:1px 7px;margin-left:8px;
    text-transform:uppercase;letter-spacing:0.06em;vertical-align:middle;
  }
  .item-info .desc{font-size:12px;color:#000;opacity:0.62;margin-top:2px;line-height:1.4;}
  .item-price{font-size:13.5px;color:var(--stamp-dark);font-weight:800;min-width:58px;text-align:right;}
  .qty-ctrl{display:flex;align-items:center;gap:0;flex:none;}
  .qty-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,0.2);
    background:rgba(0,0,0,0.04);color:#000;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;user-select:none;
  }
  .qty-btn:active{background:rgba(0,0,0,0.12);}
  .qty-num{width:30px;text-align:center;font-weight:700;font-size:14px;color:#000;}
  .qty-btn.add-only{
    width:auto;padding:0 14px;border-radius:20px;background:var(--stamp);border-color:var(--stamp);
    color:var(--text-hi);
    font-size:12.5px;font-weight:600;
  }
  .qty-btn.note-btn{margin-left:6px;font-size:13px;}
  .item-info .ticket-note{margin-top:4px;}
  .empty-state{color:var(--text-lo);font-size:13.5px;padding:30px 6px;text-align:center;}

  /* confirm dialog + toast (replacing native confirm/alert for compatibility) */
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:flex;align-items:center;justify-content:center;z-index:200;
    padding:20px;
  }
  .confirm-box{
    color-scheme: light;
    background:var(--paper);color:#000;border-radius:12px;
    padding:22px 22px 16px;max-width:320px;width:100%;
    box-shadow:var(--shadow);text-align:center;
  }
  .confirm-box p{margin:0 0 18px;font-size:14.5px;font-weight:600;line-height:1.4;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{
    flex:1;padding:11px 10px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;border:none;
  }
  .confirm-cancel{background:rgba(0,0,0,0.08);color:#000;}
  .confirm-ok{background:var(--stamp);color:var(--text-hi);}
  .toast{
    color-scheme: light;
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:var(--paper);color:#000;font-size:13px;font-weight:600;
    padding:12px 20px;border-radius:30px;box-shadow:var(--shadow);
    opacity:0;transition:opacity .25s ease, transform .25s ease;
    z-index:210;max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* historial de pagos */
  .history-box{
    color-scheme: light;
    background:var(--paper);color:#000;border-radius:14px;
    padding:0;max-width:520px;width:100%;max-height:82vh;
    box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  }
  .history-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border-bottom:1px solid var(--paper-line);flex:none;
  }
  .history-head h3{margin:0;font-family:var(--font-display);font-size:19px;}
  .history-head button{
    background:rgba(0,0,0,0.06);border:none;color:#000;
    width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;
  }
  .history-summary{
    padding:12px 20px;border-bottom:1px dashed var(--paper-line);
    display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-ink-lo);flex:none;
  }
  .history-summary b{color:#000;font-size:15px;font-family:var(--font-display);}
  .history-list{overflow-y:auto;padding:8px 14px 18px;flex:1;}
  .history-entry{
    border:1px solid var(--paper-2);border-radius:10px;margin:8px 0;overflow:hidden;
  }
  .history-entry-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;cursor:pointer;background:rgba(0,0,0,0.02);
  }
  .history-entry-head .htitle{font-weight:700;font-size:13.5px;}
  .history-entry-head .hmeta{font-size:11px;color:var(--text-ink-lo);margin-top:2px;}
  .history-entry-head .htotal{font-weight:800;color:var(--stamp-dark);font-size:14px;white-space:nowrap;}
  .history-entry-detail{
    display:none;padding:4px 14px 12px;border-top:1px dashed var(--paper-line);
  }
  .history-entry.open .history-entry-detail{display:block;}
  .history-entry.open .chev{transform:rotate(180deg);}
  .hdet-line{
    display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;
    border-bottom:1px dotted var(--paper-line);
  }
  .hdet-line:last-child{border-bottom:none;}
  .hdet-line .q{color:var(--stamp-dark);font-weight:700;margin-right:5px;}
  .history-empty{color:var(--text-ink-lo);font-size:13px;text-align:center;padding:36px 10px;}
  .chev{transition:.15s;font-size:11px;color:var(--text-ink-lo);flex:none;}

  /* ticket / receipt panel */
  .ticket-panel{
    width:300px;flex:none;
    border-left:1px solid rgba(var(--line),0.08);
    display:flex;flex-direction:column;
    background:linear-gradient(180deg, rgba(var(--line),0.02), transparent 40%);
  }
  .ticket-inner{
    color-scheme: light;
    margin:16px;
    background:var(--paper);
    color:var(--text-ink-hi);
    border-radius:6px;
    position:relative;
    display:flex;flex-direction:column;
    flex:1;min-height:0;
    box-shadow:var(--shadow);
  }
  .ticket-inner::before, .ticket-inner::after{
    content:"";position:absolute;left:0;right:0;height:10px;
    background:
      radial-gradient(circle 6px at 10px 0, transparent 5px, var(--paper) 6px) 0 0/20px 10px repeat-x;
  }
  .ticket-inner::before{top:-9px; transform:rotate(180deg);}
  .ticket-inner::after{bottom:-9px;}
  .ticket-head{
    padding:18px 18px 10px;text-align:center;border-bottom:1px dashed var(--paper-line);
  }
  .ticket-head .mark{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:0.18em;}
  .ticket-head .mesa-num{font-family:var(--font-display);font-weight:800;font-size:26px;margin-top:2px;}
  .ticket-head .ts{font-size:10.5px;color:var(--text-ink-lo);margin-top:4px;}
  .ticket-items{
    flex:1;overflow-y:auto;padding:10px 18px;
  }
  .ticket-line{
    display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;
    border-bottom:1px dotted var(--paper-line);
  }
  .ticket-line .l-name{flex:1;}
  .ticket-line .l-name .q{color:var(--stamp-dark);font-weight:700;margin-right:5px;}
  .ticket-line .l-price{font-weight:700;white-space:nowrap;}
  .ticket-line .l-remove{
    background:none;border:none;color:var(--text-ink-lo);cursor:pointer;font-size:14px;padding:0 2px;
  }
  .ticket-empty{color:var(--text-ink-lo);font-size:12.5px;text-align:center;padding:26px 6px;}
  .ticket-foot{
    padding:14px 18px 18px;border-top:1px dashed var(--paper-line);
  }
  .ticket-total{
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;
  }
  .ticket-total .lbl{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-ink-lo);}
  .ticket-total .val{font-family:var(--font-display);font-weight:800;font-size:22px;}
  .ticket-count{font-size:11px;color:var(--text-ink-lo);}
  .mobile-ticket-toggle{display:none;}

  /* picker de mesas (juntar / recuperar tiquet) */
  .picker-box{
    background:var(--paper);color:#000;border-radius:14px;
    padding:22px;max-width:420px;width:100%;
    box-shadow:var(--shadow);text-align:center;
  }
  .picker-box p{margin:0 0 16px;font-size:14px;font-weight:700;line-height:1.4;}
  .picker-grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;
    max-height:50vh;overflow-y:auto;
  }
  .picker-chip{
    background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.12);
    border-radius:8px;padding:10px 4px;font-size:12.5px;font-weight:700;
    color:#000;cursor:pointer;
  }
  .picker-chip.busy{background:rgba(var(--accent-rgb),0.12);border-color:rgba(var(--accent-rgb),0.4);color:var(--stamp-dark);}
  .picker-chip:hover{border-color:var(--gold);}

  .note-box{
    background:var(--paper);color:#000;border-radius:14px;
    padding:22px;max-width:420px;width:100%;
    box-shadow:var(--shadow);text-align:left;
  }
  .note-box h3{margin:0 0 6px;font-size:16px;font-weight:800;}
  .note-box p{margin:0 0 14px;font-size:12.5px;color:rgba(0,0,0,.62);}
  .note-input{
    width:100%;min-height:90px;resize:vertical;
    background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.16);
    color:#000;padding:11px 13px;border-radius:10px;font-size:14px;
    outline:none;font-family:inherit;
  }
  .note-input:focus{border-color:var(--gold);}
  .price-input{min-height:auto;height:46px;font-weight:700;font-size:16px;}
  .note-actions{display:flex;gap:10px;margin-top:14px;}
  .note-actions button{
    flex:1;padding:11px 10px;border-radius:8px;font-size:13.5px;
    font-weight:700;cursor:pointer;border:none;
  }
  .note-cancel{background:rgba(0,0,0,.08);color:#000;}
  .note-save{background:var(--stamp);color:var(--text-hi);}
  .ticket-note{
    display:block;margin:3px 0 2px 24px;font-size:11px;
    color:var(--stamp-dark);font-style:italic;line-height:1.35;
  }
  .picker-cancel{
    width:100%;padding:11px 10px;border-radius:8px;font-size:13.5px;font-weight:700;
    cursor:pointer;border:none;background:rgba(0,0,0,0.08);color:#000;
  }

  /* caja: pago (efectivo/tarjeta) y asignar personas */
  .pay-method-grid{display:flex;gap:10px;margin:6px 0 16px;}
  .pay-method-btn{
    flex:1;padding:16px 8px;border-radius:12px;border:1px solid rgba(0,0,0,0.16);
    background:rgba(0,0,0,0.04);color:#000;font-size:14px;font-weight:800;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .pay-method-btn span.ico{font-size:22px;}
  .pay-method-btn:hover{border-color:var(--gold);background:rgba(var(--accent-rgb),0.1);}
  .pay-summary-row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;}
  .pay-summary-row b{font-size:15px;}
  .pay-change-box{
    margin-top:10px;padding:10px 12px;border-radius:10px;
    background:rgba(79,125,67,0.12);border:1px solid rgba(79,125,67,0.35);
    display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:#3f6b36;
  }
  .people-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 14px;}
  .people-chip{
    padding:14px 4px;border-radius:10px;border:1px solid rgba(0,0,0,0.16);
    background:rgba(0,0,0,0.04);color:#000;font-size:16px;font-weight:800;cursor:pointer;
  }
  .people-chip:hover{border-color:var(--gold);background:rgba(var(--accent-rgb),0.12);}
  .history-reprint{
    margin-top:8px;width:100%;padding:9px;border-radius:8px;font-size:12px;font-weight:700;
    cursor:pointer;border:1px solid rgba(90,169,163,0.4);background:rgba(90,169,163,0.1);color:#2f6a63;
  }

  /* prompt (aparcar tiquet) */
  .prompt-input{
    width:100%;background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.16);
    color:#000;padding:11px 14px;border-radius:10px;font-size:14px;
    margin-bottom:16px;outline:none;text-align:center;
  }
  .prompt-input:focus{border-color:var(--gold);}

  /* acciones dentro de un tiquet aparcado */
  .parked-actions{display:flex;gap:8px;margin-top:10px;}
  .parked-resume, .parked-delete{
    flex:1;padding:9px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;
  }
  .parked-resume{background:var(--stamp);color:var(--text-hi);}
  .parked-delete{background:rgba(0,0,0,0.07);color:#000;}

  /* scrollbars */
  .cat-rail::-webkit-scrollbar, .items-area::-webkit-scrollbar, .ticket-items::-webkit-scrollbar{width:8px;}
  .cat-rail::-webkit-scrollbar-thumb, .items-area::-webkit-scrollbar-thumb{background:rgba(var(--line),0.12);border-radius:8px;}
  .ticket-items::-webkit-scrollbar-thumb{background:rgba(21,17,13,0.18);border-radius:8px;}

  /* responsive */
  @media (min-width: 1400px){
    .items-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-content:start;}
    .cat-rail{width:210px;}
    .ticket-panel{width:320px;}
  }
  @media (max-width: 980px){
    .ticket-panel{
      position:fixed;right:0;bottom:0;top:auto;left:0;width:auto;height:70vh;
      transform:translateY(calc(100% - 58px));
      transition:transform .25s ease;
      border-left:none;border-top:1px solid rgba(var(--line),0.1);
      z-index:30; background:var(--ink-2);
    }
    .ticket-panel.open{transform:translateY(0);}
    .ticket-inner{margin:10px;}
    .mobile-ticket-toggle{
      display:flex;position:fixed;left:50%;transform:translateX(-50%);
      bottom:calc(12px + env(safe-area-inset-bottom));z-index:31;
      background:var(--stamp);color:var(--text-hi);border:none;
      padding:11px 22px;border-radius:30px;font-size:13px;font-weight:700;
      align-items:center;gap:8px;box-shadow:var(--shadow);cursor:pointer;
    }
    .table-body{padding-bottom:76px;}
  }
  @media (max-width: 760px){
    .toolbar-btns{gap:8px;}
    .tb-btn{min-width:0;flex:1 1 46%;font-size:11.5px;padding:0 10px;height:42px;}
    .status-key{flex:1 1 100%;flex-direction:row;justify-content:space-around;}
  }
  @media (max-width: 640px){
    .topbar{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));gap:8px 10px;}
    .brand h1{font-size:16px;}
    .brand .mark{width:28px;height:28px;font-size:13px;}
    .brand small{font-size:9.5px;}
    #home-view{padding:14px 12px 0;}
    .home-head h2{font-size:18px;}
    .home-head{gap:10px;}
    .legend{gap:10px;}
    .legend span{font-size:10.5px;}
    .floor-wrap{padding:12px;}
    .floor{min-width:680px;grid-auto-rows:68px;}
    .floor-toolbar{padding:12px 0 16px;}
    .lang-btn{padding:5px 8px 5px 5px;font-size:10px;}
    .session-chip{font-size:10px;padding:5px 9px;}
    .sync-badge{font-size:9.5px;padding:4px 8px;}

    .table-topbar{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));}
    .table-title h2{font-size:15px;}
    .table-title .num{width:32px;height:32px;font-size:18px;}
    .back-btn{padding:8px 12px;font-size:12.5px;}
    .table-actions{width:100%;flex-wrap:wrap;}
    .pay-btn, .clear-mesa-btn, .park-btn-top, .print-btn-top{flex:1 1 30%;text-align:center;padding:9px 6px;font-size:11.5px;}
    .search-wrap{width:100%;order:10;}
    .variable-btn{order:9;padding:8px 12px;font-size:11px;}

    .cat-rail{
      width:100%;height:auto;border-right:none;border-bottom:1px solid rgba(var(--line),0.08);
      display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
      padding:10px 12px;white-space:nowrap;
    }
    .cat-group-label{display:none;}
    .cat-btn{width:auto;flex:none;margin-right:4px;padding:11px 14px;font-size:13.5px;}
    .table-body{flex-direction:column;}
    .items-area{padding:14px;}
    .items-heading{font-size:17px;}
    .item-row{padding:13px 12px;gap:10px;}
    .item-info .name{font-size:14px;}
    .qty-btn{width:38px;height:38px;font-size:19px;}
    .qty-num{width:26px;font-size:15px;}
    .qty-btn.add-only{padding:0 16px;height:38px;}

    .login-sub{font-size:12.5px;}
    .session-input{width:100%;max-width:220px;font-size:28px;padding:14px 8px 14px 16px;}
    .history-box{max-height:88vh;}
  }
  @media (max-width: 400px){

function buildMenu(lang){
  return MENU_SRC.map(function(sec, si){
    return {
      cat: sec.cat[lang], group: sec.group[lang], groupKey: sec.group.es,
      items: sec.items.map(function(it, ii){
        return { id: si+'-'+ii, name: it[lang][0], desc: it[lang][1], price: it.price,
          mixers: it.mixers ? it.mixers[lang] : null,
          extras: it.extras ? it.extras[lang] : null };
      })
    };
  });
}
function buildFlat(menu){
  const flat = [];
  menu.forEach(function(section){
    section.items.forEach(function(it){
      flat.push({ id: it.id, cat: section.cat, group: section.group, groupKey: section.groupKey, name: it.name, desc: it.desc, price: it.price, mixers: it.mixers || null, extras: it.extras || null });
    });
  });
  return flat;
}
// Identifica a qué puesto (Cocina / Pizza / Postres) pertenece un artículo, para la vista de cocina.
function kitchenGroupOf(item){
  // Un solo puesto: Cocina prepara todo (comida y bebidas).
  return item ? "Cocina" : null;
}
/* Devuelve (o crea) la línea de carta correspondiente a un artículo con una opción elegida
   (refresco de un combinado, o "con hielo / con limón / sin nada" de un refresco).
   Se guarda en FLAT con un id derivado, para que quede registrada igual que cualquier otro plato.
   suffix distingue el tipo de opción: 'mx' = mixer (refresco de combinado), 'ex' = extra (hielo/limón/nada). */
function getOptionVariant(baseItem, optionList, optionIndex, suffix){
  const idx = optionIndex || 0;
  const variantId = baseItem.id + '-' + suffix + idx;
  let existing = FLAT.find(f => f.id === variantId);
  if(existing) return existing;
  const optionName = optionList ? optionList[idx] : null;
  const variant = {
    id: variantId,
    cat: baseItem.cat,
    group: baseItem.group,
    groupKey: baseItem.groupKey,
    name: optionName ? baseItem.name + ' · ' + optionName : baseItem.name,
    desc: baseItem.desc,
    price: baseItem.price,
    mixers: null,
    extras: null
  };
  FLAT.push(variant);
  return variant;
}
function getMixerVariant(baseItem, mixerIndex){
  return getOptionVariant(baseItem, baseItem.mixers, mixerIndex, 'mx');
}

function getOrderNote(tableId, itemId){
  const order = orders[tableId] || {};
  const notes = order._notes || {};
  return notes[itemId] || "";
}

function writeOrderNote(tableId, itemId, note){
  const clean = String(note || "").trim();
  if(firebaseReady && currentSession){
    const path = DB_ROOT + "sessions/" + currentSession + "/orders/" + tableId + "/_notes/" + itemId;
    if(clean) db.ref(path).set(clean);
    else db.ref(path).remove();
  } else {
    orders[tableId] = orders[tableId] || {};
    orders[tableId]._notes = orders[tableId]._notes || {};
    if(clean) orders[tableId]._notes[itemId] = clean;
    else delete orders[tableId]._notes[itemId];
    refreshAfterOrdersChange();
  }
}

// Estado de preparación de un artículo (tick de Cocina / Pizza).
function getItemDone(tableId, itemId){
  const order = orders[tableId] || {};
  const done = order._done || {};
  return !!done[itemId];
}
function writeItemDone(tableId, itemId, done){
  if(firebaseReady && currentSession){
    const path = DB_ROOT + "sessions/" + currentSession + "/orders/" + tableId + "/_done/" + itemId;
    if(done) db.ref(path).set(true);
    else db.ref(path).remove();
  } else {
    orders[tableId] = orders[tableId] || {};
    orders[tableId]._done = orders[tableId]._done || {};
    if(done) orders[tableId]._done[itemId] = true;
    else delete orders[tableId]._done[itemId];
    refreshAfterOrdersChange();
  }
}

// Personas asignadas a una mesa (se pide al abrir una mesa vacía desde Comanda).
function getTablePeople(tableId){
  const o = orders[tableId] || {};
  return o._people || null;
}
function writeTablePeople(tableId, n){
  if(firebaseReady && currentSession){
    db.ref(DB_ROOT + "sessions/" + currentSession + "/orders/" + tableId + "/_people").set(n);
  } else {
    orders[tableId] = orders[tableId] || {};
    orders[tableId]._people = n;
    refreshAfterOrdersChange();
  }
}

function openNoteEditor(itemId, itemName, onDone){
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  const current = getOrderNote(currentTable, itemId);
  overlay.innerHTML = `
    <div class="note-box">
      <h3>${I18N[currentLang].note}: ${itemName}</h3>
      <p>${I18N[currentLang].noNote}</p>
      <textarea class="note-input" maxlength="180" placeholder="${I18N[currentLang].notePlaceholder}">${current.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</textarea>
      <div class="note-actions">
        <button class="note-cancel">${I18N[currentLang].cancel}</button>
        <button class="note-save">${I18N[currentLang].noteSave}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector(".note-input");
  setTimeout(()=>{ input.focus(); input.setSelectionRange(input.value.length,input.value.length); },50);

  const close = ()=>overlay.remove();
  const save = ()=>{
    writeOrderNote(currentTable, itemId, input.value);
    close();
    if(onDone) onDone();
  };
  overlay.addEventListener("click", e=>{ if(e.target===overlay) close(); });
  overlay.querySelector(".note-cancel").addEventListener("click", close);
  overlay.querySelector(".note-save").addEventListener("click", save);
  input.addEventListener("keydown", e=>{
    if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); save(); }
  });
}
function getExtraVariant(baseItem, extraIndex){
  return getOptionVariant(baseItem, baseItem.extras, extraIndex, 'ex');
}
/* Tras reconstruir FLAT (cambio de idioma, sincronización...) hay que volver a crear
   en FLAT las líneas de combinados+refresco / refrescos+hielo-limón que ya estén en
   alguna comanda, si no, el ticket no encontraría el artículo. */
function regenerateMixerVariants(){
  const seen = new Set();
  Object.keys(orders).forEach(function(tableId){
    Object.keys(orders[tableId] || {}).forEach(function(id){
      if(seen.has(id)) return;
      let m = id.match(/^(.*)-mx(\d+)$/);
      if(m){
        seen.add(id);
        const baseItem = FLAT.find(f => f.id === m[1]);
        if(baseItem && baseItem.mixers) getMixerVariant(baseItem, parseInt(m[2], 10));
        return;
      }
      m = id.match(/^(.*)-ex(\d+)$/);
      if(m){
        seen.add(id);
        const baseItem = FLAT.find(f => f.id === m[1]);
        if(baseItem && baseItem.extras) getExtraVariant(baseItem, parseInt(m[2], 10));
      }
    });
  });
}

// Normaliza texto para la búsqueda: minúsculas y sin acentos, así "agua" encuentra "Água"/"AGUA" etc.
// sin cruzarse con otras palabras que sólo comparten alguna letra.
function normalizeText(s){
  return (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
// Comprueba si "query" aparece como palabra completa (o frase completa) dentro de "text".
// Así, buscar "agua" no encuentra "aguacate" dentro de la descripción de otro plato: sólo
// cuenta si "agua" está sola, separada por espacios u otros signos, no pegada a más letras.
function wholeWordIncludes(text, query){
  if(!query) return false;
  const t = normalizeText(text);
  const q = normalizeText(query);
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("(^|[^a-z0-9])" + escaped + "($|[^a-z0-9])");
  return re.test(t);
}
function isBarra(id){ return id >= 500; }

/* ===================== HELPERS ===================== */
const eur = n => n.toFixed(2).replace(".", ",") + " €";
// Claves internas de orders[tableId] que no son artículos (notas, tick de cocina).
const RESERVED_ORDER_KEYS = ["_notes", "_done", "_people"];
function isItemId(id){ return RESERVED_ORDER_KEYS.indexOf(id) === -1; }
function tableTotal(t){
  const o = orders[t];
  return Object.keys(o).filter(isItemId).reduce((sum,id)=>{
    const item = FLAT.find(f=>f.id===id);
    return sum + (item ? item.price*o[id] : 0);
  },0);
}
function tableCount(t){
  return Object.keys(orders[t]).filter(isItemId).reduce((a,id)=>a+orders[t][id],0);
}

function historyFromSnapshot(val){
  if(!val) return [];
  return Object.keys(val).sort().map(k => ({
    id: k, table: val[k].table, ts: val[k].ts,
    items: val[k].items || [], total: val[k].total || 0,
    method: val[k].method || null,
    paidAmount: val[k].paidAmount != null ? val[k].paidAmount : null,
    change: val[k].change != null ? val[k].change : null,
    people: val[k].people || null,
    date: val[k].date || null,
    time: val[k].time || null,
    ticketNo: val[k].ticketNo || null
  }));
}
function parkedFromSnapshot(val){
  if(!val) return [];
  return Object.keys(val).sort().map(k => ({
    id: k, label: val[k].label, ts: val[k].ts,
    items: val[k].items || {}, total: val[k].total || 0
  }));
}

// Conexión base a Firebase (una sola vez, independiente del código de sesión).
function connectFirebase(){
  const configured = typeof firebase !== "undefined"
    && FIREBASE_CONFIG.apiKey
    && FIREBASE_CONFIG.apiKey.indexOf("TU_API_KEY") === -1;
  if(!configured){
    firebaseReady = false;
    updateSyncBadge(false);
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    firebase.auth().signInAnonymously().then(()=>{
      db = firebase.database();
      firebaseReady = true;
      updateSyncBadge(true);
      if(currentSession) attachSessionListeners(currentSession);
    }).catch(err=>{
      console.warn("Firebase auth error:", err);
      firebaseReady = false;
      updateSyncBadge(false);
    });
  } catch(err){
    console.warn("Firebase init error:", err);
    firebaseReady = false;
    updateSyncBadge(false);
  }
}
// Engancha los listeners en tiempo real a la sala del código elegido.
function attachSessionListeners(code){
  detachSessionListeners();
  ordersRef = db.ref(DB_ROOT + "sessions/" + code + "/orders");
  historyRef = db.ref(DB_ROOT + "sessions/" + code + "/history");
  parkedRef = db.ref(DB_ROOT + "sessions/" + code + "/parked");
  ordersRef.on("value", snap=>{
    const val = snap.val() || {};
    const next = {};
    ALL_IDS.forEach(id => { next[id] = val[id] || {}; });
    orders = next;
    refreshAfterOrdersChange();
  });
  historyRef.on("value", snap=>{
    history = historyFromSnapshot(snap.val());
  });
  parkedRef.on("value", snap=>{
    parked = parkedFromSnapshot(snap.val());
  });
}
function detachSessionListeners(){
  if(ordersRef) ordersRef.off();
  if(historyRef) historyRef.off();
  if(parkedRef) parkedRef.off();
  ordersRef = null;
  historyRef = null;
  parkedRef = null;
}
// Entrar en una sesión (código de sala compartida).
function joinSession(code){
  currentSession = code;
  orders = {};
  ALL_IDS.forEach(id => orders[id] = {});
  history = [];
  parked = [];
  document.getElementById("current-session-label").textContent = code;
  if(firebaseReady){
    attachSessionListeners(code);
  }
  try{ localStorage.setItem("mos_session_code", code); }catch(e){}
  document.getElementById("login-view").hidden = true;
  showRoleView();
}
// Salir de la sesión y volver a la pantalla de código.
function leaveSession(){
  detachSessionListeners();
  currentSession = null;
  try{ localStorage.removeItem("mos_session_code"); }catch(e){}
  orders = {};
  ALL_IDS.forEach(id => orders[id] = {});
  history = [];
  parked = [];
  currentTable = null;
  document.getElementById("home-view").hidden = true;
  document.getElementById("table-view").hidden = true;
  document.getElementById("kitchen-view").hidden = true;
  document.getElementById("mobile-ticket-toggle").hidden = true;
  document.getElementById("login-view").hidden = false;
  document.getElementById("login-error").hidden = true;
  document.getElementById("session-input").value = "";
}

/* ===================== PANTALLA COMPLETA (Cocina y Caja) ===================== */
function fsSupported(){
  const el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen);
}
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen(){
  const el = document.documentElement;
  try{
    if(isFullscreen()){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      const r = req.call(el);
      if(r && r.catch) r.catch(()=>{});
    }
  }catch(e){}
}
function updateFullscreenButtons(){
  const t = I18N[currentLang];
  const ok = fsSupported();
  const homeBtn = document.getElementById("fs-btn-home");
  const kitBtn = document.getElementById("fs-btn-kitchen");
  if(homeBtn) homeBtn.hidden = !ok || appRole !== "caja";
  if(kitBtn) kitBtn.hidden = !ok;
  document.querySelectorAll(".fs-btn .fs-label").forEach(el=>{
    el.textContent = isFullscreen() ? t.fsExit : t.fsEnter;
  });
}
document.querySelectorAll(".fs-btn").forEach(b=>b.addEventListener("click", toggleFullscreen));
document.addEventListener("fullscreenchange", updateFullscreenButtons);
document.addEventListener("webkitfullscreenchange", updateFullscreenButtons);

// Cola de platos pendientes/preparados para Cocina o Pizza, agrupada por mesa.
function renderKitchen(){
  const body = document.getElementById("kitchen-body");
  if(!body) return;
  const groupKey = appRole === "cocina" ? "Cocina" : (appRole === "pizza" ? "Pizzas" : (appRole === "postre" ? "Postres" : null));
  if(!groupKey){ body.innerHTML = ""; return; }
  const t = I18N[currentLang];
  const cards = [];
  ALL_IDS.forEach(tableId=>{
    const order = orders[tableId] || {};
    const lines = Object.keys(order).filter(isItemId).map(itemId=>{
      const item = FLAT.find(f=>f.id===itemId);
      if(!item || kitchenGroupOf(item) !== groupKey) return null;
      return {
        itemId,
        name: item.name,
        qty: order[itemId],
        note: getOrderNote(tableId, itemId),
        done: getItemDone(tableId, itemId)
      };
    }).filter(Boolean);
    if(lines.length === 0) return;
    lines.sort((a,b)=> (a.done - b.done) || a.name.localeCompare(b.name));
    const pending = lines.filter(l=>!l.done).length;
    cards.push({ tableId, label: tableLabel(tableId), lines, pending });
  });
  if(cards.length === 0){
    body.innerHTML = `<div class="kitchen-empty">${t.kitchenEmpty}</div>`;
    return;
  }
  cards.sort((a,b)=> (b.pending>0) - (a.pending>0) || a.tableId - b.tableId);
  body.innerHTML = cards.map(card=>`
    <div class="kitchen-table-card" data-table="${card.tableId}">
      <div class="kitchen-table-head">
        <span>${card.label}</span>
        <span class="kth-pending">${card.pending>0 ? t.kitchenPending(card.pending) : t.kitchenAllDone}</span>
      </div>
      ${card.lines.map(l=>`
        <div class="kitchen-line ${l.done?'done':''}" data-item="${l.itemId}">
          <div class="kl-info">
            <span class="kl-name"><span class="kl-qty">${l.qty}×</span>${l.name}</span>
            ${l.note ? `<span class="kl-note">📝 ${l.note.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</span>` : ""}
          </div>
          <button class="kl-tick" title="${t.kitchenTick}">✓</button>
        </div>
      `).join("")}
    </div>
  `).join("");
  body.querySelectorAll(".kitchen-line").forEach(line=>{
    line.querySelector(".kl-tick").addEventListener("click", ()=>{
      const tableId = Number(line.closest(".kitchen-table-card").dataset.table);
      const itemId = line.dataset.item;
      writeItemDone(tableId, itemId, !getItemDone(tableId, itemId));
    });
  });
}

// Escritura de pedidos: si hay Firebase, se persiste ahí (y el listener
// de arriba actualiza la vista); si no, se actualiza solo en local.
function writeQty(tableId, itemId, qty){
  if(firebaseReady && currentSession){
    const path = DB_ROOT + "sessions/" + currentSession + "/orders/" + tableId + "/" + itemId;
    if(qty <= 0) db.ref(path).remove();
    else db.ref(path).set(qty);
  } else {
    if(qty <= 0) delete orders[tableId][itemId];
    else orders[tableId][itemId] = qty;
    refreshAfterOrdersChange();
  }
}
function writeClearTable(tableId){
  if(firebaseReady && currentSession){
    db.ref(DB_ROOT + "sessions/" + currentSession + "/orders/" + tableId).remove();
  } else {
    orders[tableId] = {};
    refreshAfterOrdersChange();
  }
}
function writePay(tableId, record){
  if(firebaseReady && currentSession){
    db.ref(DB_ROOT + "sessions/" + currentSession + "/history").push(record);
    db.ref(DB_ROOT + "sessions/" + currentSession + "/orders/" + tableId).remove();
  } else {
    record.id = historyCounter++;
    history.push(record);
    orders[tableId] = {};
  }
}
function writeCloseDay(){
  if(firebaseReady && currentSession){
    db.ref(DB_ROOT + "sessions/" + currentSession + "/orders").remove();
    db.ref(DB_ROOT + "sessions/" + currentSession + "/history").remove();
    db.ref(DB_ROOT + "sessions/" + currentSession + "/parked").remove();
  } else {
    orders = {};
    ALL_IDS.forEach(id => orders[id] = {});
    history = [];
    parked = [];
  }
  resetTicketCounter();
}
function writePark(tableId, label){
  const items = Object.assign({}, orders[tableId]);
  const localeMap = { es:"es-ES", ca:"ca-ES", en:"en-GB" };
  const record = {
    label: label,
    ts: new Date().toLocaleString(localeMap[currentLang],{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}),
    items: items,
    total: tableTotal(tableId)
  };
  if(firebaseReady && currentSession){
    db.ref(DB_ROOT + "sessions/" + currentSession + "/parked").push(record);
    db.ref(DB_ROOT + "sessions/" + currentSession + "/orders/" + tableId).remove();
  } else {
    record.id = "p" + (parkedCounter++);
    parked.push(record);
    orders[tableId] = {};
  }
}
function writeRemoveParked(key){
  if(firebaseReady && currentSession){
    db.ref(DB_ROOT + "sessions/" + currentSession + "/parked/" + key).remove();
  } else {
    parked = parked.filter(p => p.id !== key);
  }
}
function resumeParked(key, targetId){
  const rec = parked.find(p => p.id === key);
  if(!rec) return;
  Object.keys(rec.items).forEach(id=>{
    const addQty = rec.items[id];
    const cur = orders[targetId][id] || 0;
    writeQty(targetId, id, cur + addQty);
  });
  writeRemoveParked(key);
}
function mergeTables(source, dest){
  const items = orders[source] || {};
  Object.keys(items).forEach(id=>{
    const addQty = items[id];
    const cur = orders[dest][id] || 0;
    writeQty(dest, id, cur + addQty);
  });
  writeClearTable(source);
}

/* ===================== CONFIRM / TOAST (propios, sin confirm()/alert() nativos) ===================== */
function showToast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{
    t.classList.remove("show");
    setTimeout(()=>t.remove(), 300);
  }, 2400);
}
function showConfirm(msg, okLabel, onYes){
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${msg}</p>
      <div class="confirm-actions">
        <button class="confirm-cancel">${I18N[currentLang].cancel}</button>
        <button class="confirm-ok">${okLabel}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector(".confirm-cancel").addEventListener("click", ()=>overlay.remove());
  overlay.querySelector(".confirm-ok").addEventListener("click", ()=>{
    overlay.remove();
    onYes();
  });
}

function showPrompt(msg, placeholder, okLabel, onSubmit){
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${msg}</p>
      <input type="text" class="prompt-input" placeholder="${placeholder}" maxlength="30">
      <div class="confirm-actions">
        <button class="confirm-cancel">${I18N[currentLang].cancel}</button>
        <button class="confirm-ok">${okLabel}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = overlay.querySelector(".prompt-input");
  setTimeout(()=>input.focus(), 50);
  const submit = ()=>{
    const val = input.value.trim();
    overlay.remove();
    onSubmit(val);
  };
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector(".confirm-cancel").addEventListener("click", ()=>overlay.remove());
  overlay.querySelector(".confirm-ok").addEventListener("click", submit);
  input.addEventListener("keydown", (e)=>{ if(e.key === "Enter"){ e.preventDefault(); submit(); } });
}

// Diálogo "¿Cuántas personas son?" — se muestra al abrir desde Comanda una mesa vacía
// sin personas asignadas todavía.
function openPeopleAssignDialog(tableId, onDone){
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  const chips = [1,2,3,4,5,6,7,8].map(n=>`<button class="people-chip" data-n="${n}">${n}</button>`).join("");
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>¿Cuántas personas son?</p>
      <div class="people-grid">${chips}</div>
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="prompt-input people-other-input" placeholder="Otro número">
      <div class="confirm-actions">
        <button class="confirm-cancel">${I18N[currentLang].cancel}</button>
        <button class="confirm-ok people-other-ok">Confirmar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const finish = (n)=>{
    overlay.remove();
    writeTablePeople(tableId, n);
    onDone();
  };
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector(".confirm-cancel").addEventListener("click", ()=>overlay.remove());
  overlay.querySelectorAll(".people-chip").forEach(btn=>{
    btn.addEventListener("click", ()=> finish(Number(btn.dataset.n)));
  });
  const otherInput = overlay.querySelector(".people-other-input");
  const submitOther = ()=>{
    const n = parseInt(otherInput.value, 10);
    if(n && n > 0) finish(n);
  };
  overlay.querySelector(".people-other-ok").addEventListener("click", submitOther);
  otherInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter"){ e.preventDefault(); submitOther(); } });
}

      h1,h2,h3{text-align:center;margin:4px 0;}
      p{margin:2px 0;}
      hr{border:none;border-top:2px dashed #000;margin:6px 0;}
      .center{text-align:center;}
      .strong{font-weight:800;font-size:15px;}
      .muted{color:#333;font-size:12px;}

      .frow2{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;}
      .frow2.strong{font-weight:800;font-size:17px;}
      /* filas de artículos (UNIT/DESCRIPCIO/PREU/IMPORT) y BASE/%IVA/IMP.IVA:
         tabla HTML con anchuras de columna fijas en vez de grid/flex o texto
         con espacios, porque grid/flex de +2 columnas y el relleno con
         espacios (que depende de que el dispositivo tenga fuente
         monoespaciada) no se renderizaban bien en la impresora fiscal. Una
         tabla con <colgroup> es el método más compatible: alinea igual
         aunque la fuente no sea monoespaciada.
         Todo el texto va en negrita (peso 700-800) para que se imprima
         oscuro y legible; la jerarquía visual (nombre, ticket nº y totales
         más grandes) se consigue solo con el TAMAÑO de letra, no con pesos
         intermedios (como 500), que en la impresora fiscal salían demasiado
         finos y apenas visibles. */
      table.rtable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;font-weight:700;}
      table.rtable th, table.rtable td{padding:2px 0;vertical-align:top;}
      table.rtable th{font-weight:800;font-size:13px;}
      .rt-unit{width:14%;text-align:left;}
      .rt-desc{width:48%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;}
      .rt-preu{width:18%;text-align:right;}
      .rt-import{width:20%;text-align:right;}
      .rb-a{width:34%;text-align:left;}
      .rb-b{width:33%;text-align:left;}
      .rb-c{width:33%;text-align:right;}
    </style>
    </head><body>${bodyHtml}</body></html>`);
  doc.close();
  setTimeout(()=>{
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(()=>{ if(iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 1000);
  }, 250);
}

// Datos fiscales del negocio, tal y como aparecen en el ticket impreso.
const BIZ_NAME = "MAN-O-SALWA";
const BIZ_ADDRESS = ["CARRER DEL CARME 95", "08001 BARCELONA", "TEL. 936 794 076"];
const BIZ_LEGAL = ""; // ← razón social del negocio (rellenar)
const BIZ_CIF = "";   // ← CIF/NIF del negocio (rellenar)
const IVA_RATE = 10; // % IVA incluido en los precios

// Formatea un número como "1234,56" (sin símbolo de moneda), como en el ticket fiscal.
function money(n){ return (Math.round((n + Number.EPSILON) * 100) / 100).toFixed(2).replace(".", ","); }

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Numeración de tickets: cada mesa/comanda abierta en Caja obtiene un número
// correlativo (001, 002, 003…) que se mantiene mientras esa comanda siga abierta,
// tanto si se imprime el "pendiente de cobro" como el recibo final ya cobrado.
let ticketCounter = 1;
try{
  const savedTicketCounter = localStorage.getItem("mos_ticket_counter");
  if(savedTicketCounter) ticketCounter = parseInt(savedTicketCounter, 10) || 1;
}catch(e){}
function saveTicketCounter(){
  try{ localStorage.setItem("mos_ticket_counter", String(ticketCounter)); }catch(e){}
}
let tableTicketNumbers = {}; // tableId -> nº de ticket asignado a la comanda actual
function getTicketNumberForTable(tableId){
  if(!tableTicketNumbers[tableId]){
    tableTicketNumbers[tableId] = ticketCounter++;
    saveTicketCounter();
  }
  return tableTicketNumbers[tableId];
}
function clearTicketNumberForTable(tableId){
  delete tableTicketNumbers[tableId];
}
function resetTicketCounter(){
  ticketCounter = 1;
  saveTicketCounter();
  tableTicketNumbers = {};
}

// Construye el HTML del ticket con el mismo formato que la impresora fiscal del
// restaurante: cabecera con datos del negocio, nº de ticket, fecha/hora, líneas de
// artículos (UNIT./DESCRIPCIO/PREU/IMPORT), desglose de BASE/%IVA/IMP.IVA, total,
// importe por comensal y, según el caso, "pendiente de cobro" o la forma de pago.
function buildReceiptHTML(opts){
  const total = opts.total;
  const base = total / (1 + IVA_RATE/100);
  const ivaAmount = total - base;
  const perPerson = opts.people ? total / opts.people : null;
  const itemRowsHtml = opts.items.length ? opts.items.map(it=>`
    <tr>
      <td class="rt-unit">${it.qty}</td>
      <td class="rt-desc">${escapeHtml(String(it.name).toUpperCase())}</td>
      <td class="rt-preu">${money(it.price)}</td>
      <td class="rt-import">${money(it.price*it.qty)}</td>
    </tr>
  `).join("") : `<tr><td colspan="4" class="center muted">Sin artículos</td></tr>`;

  let payBlock;
  if(opts.pending){
    payBlock = `<div class="frow2 strong"><span>PENDIENTE DE COBRO</span><span>${money(total)}</span></div>`;
  } else {
    payBlock = `
      <div class="frow2"><span>FORMA DE PAGO</span><span>${opts.method === "efectivo" ? "EFECTIVO" : "TARJETA"}</span></div>
      ${opts.method === "efectivo" ? `
        <div class="frow2"><span>ENTREGADO</span><span>${money(opts.paidAmount)}</span></div>
        <div class="frow2"><span>CAMBIO</span><span>${money(opts.change)}</span></div>
      ` : ""}
    `;
  }

  return `
    <p class="center strong">*** ${BIZ_NAME} ***</p>
    ${BIZ_ADDRESS.map(l=>`<p class="center">${l}</p>`).join("")}
    ${BIZ_LEGAL ? `<p class="center">${BIZ_LEGAL}</p>` : ""}
    ${BIZ_CIF ? `<p class="center">CIF: ${BIZ_CIF}</p>` : ""}
    <hr>
    <p class="center strong">${String(opts.ticketNo).padStart(3,"0")}</p>
    <hr>
    <div class="frow2"><span>FRA SIM:COMPROBANTE</span><span>HORA:${opts.time}</span></div>
    <div class="frow2"><span>DATA:${opts.date}</span><span></span></div>
    <hr>
    <table class="rtable">
      <thead>
        <tr>
          <th class="rt-unit">UNIT.</th>
          <th class="rt-desc">DESCRIPCIO</th>
          <th class="rt-preu">PREU</th>
          <th class="rt-import">IMPORT</th>
        </tr>
      </thead>
      <tbody>
        ${itemRowsHtml}
      </tbody>
    </table>
    <hr>
    <table class="rtable">
      <tr>
        <td class="rb-a">BASE</td>
        <td class="rb-b">%IVA</td>
        <td class="rb-c">IMP.IVA</td>
      </tr>
      <tr>
        <td class="rb-a">${money(base)}</td>
        <td class="rb-b">${IVA_RATE.toFixed(2).replace(".",",")}</td>
        <td class="rb-c">${money(ivaAmount)}</td>
      </tr>
    </table>
    <hr>
    <div class="frow2 strong"><span>TOTAL EUROS</span><span>${money(total)}</span></div>
    ${perPerson != null ? `<div class="frow2"><span>IMPORT PER COMENÇAL</span><span>${money(perPerson)}</span></div>` : ""}
    <hr>
    ${payBlock}
    <hr>
    <p class="center">GRACIES PER LA SEVA VISITA</p>
    <p class="center">${IVA_RATE}% IVA INCLOS</p>
  `;
}

// Fecha/hora en el formato del ticket fiscal: DD/MM/AAAA y HH:MM.
function ticketDateParts(d){
  const pad = n => String(n).padStart(2,"0");
  return {
    date: `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`,
    time: `${pad(d.getHours())}:${pad(d.getMinutes())}`
  };
}

// Imprime el "comprobante" (pendiente de cobro) de la comanda actual de una mesa.
function printTableTicket(tableId){
  const items = Object.keys(orders[tableId] || {}).filter(isItemId).map(id=>{
    const item = FLAT.find(f=>f.id===id);
    return item ? { name: item.name, qty: orders[tableId][id], price: item.price } : null;
  }).filter(Boolean);
  const { date, time } = ticketDateParts(new Date());
  printHTML(buildReceiptHTML({
    ticketNo: getTicketNumberForTable(tableId),
    date, time,
    people: getTablePeople(tableId),
    items,
    total: tableTotal(tableId),
    pending: true
  }));
}
// Reimprime el ticket final (ya cobrado) de un registro del historial.
function printHistoryRecord(record){
  let date = record.date, time = record.time;
  if(!date || !time){
    // Registros antiguos (antes de este formato) no guardan date/time por separado;
    // se usa el texto ya formateado que tuvieran como aproximación.
    date = record.ts || ""; time = "";
  }
  printHTML(buildReceiptHTML({
    ticketNo: record.ticketNo || "—",
    date, time,
    people: record.people || null,
    items: record.items,
    total: record.total,
    method: record.method || null,
    paidAmount: record.paidAmount != null ? record.paidAmount : null,
    change: record.change != null ? record.change : null,
    pending: false
  }));
}

// Diálogo de cobro desde Caja: elegir Efectivo/Tarjeta, calcular el cambio e imprimir.
function openPaymentDialog(tableId, onPaid){
  const total = tableTotal(tableId);
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>Cobrar ${tableLabel(tableId)} — <b>${eur(total)}</b></p>
      <div class="pay-method-grid">
        <button class="pay-method-btn" data-method="efectivo"><span class="ico">💵</span>Efectivo</button>
        <button class="pay-method-btn" data-method="tarjeta"><span class="ico">💳</span>Tarjeta</button>
      </div>
      <button class="confirm-cancel" style="width:100%;">${I18N[currentLang].cancel}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector(".confirm-cancel").addEventListener("click", ()=>overlay.remove());

  const finish = (method, paidAmount, change)=>{
    overlay.remove();
    onPaid({ method, paidAmount, change });
  };

  overlay.querySelector('[data-method="tarjeta"]').addEventListener("click", ()=>{
    finish("tarjeta", total, 0);
  });
  overlay.querySelector('[data-method="efectivo"]').addEventListener("click", ()=>{
    overlay.innerHTML = `
      <div class="confirm-box">
        <p>Efectivo — ${tableLabel(tableId)}</p>
        <div class="pay-summary-row"><span>Total a cobrar</span><b>${eur(total)}</b></div>
        <input type="text" inputmode="decimal" class="prompt-input cash-paid-input" placeholder="¿Cuánto ha pagado?">
        <div class="pay-change-box" hidden><span>Cambio</span><span class="cash-change-val">0,00 €</span></div>
        <div class="confirm-actions">
          <button class="confirm-cancel">${I18N[currentLang].cancel}</button>
          <button class="confirm-ok cash-confirm">Cobrar e imprimir</button>
        </div>
      </div>
    `;
    const input = overlay.querySelector(".cash-paid-input");
    const changeBox = overlay.querySelector(".pay-change-box");
    const changeVal = overlay.querySelector(".cash-change-val");
    setTimeout(()=>input.focus(), 50);
    const updateChange = ()=>{
      const paid = parseFloat((input.value||"").replace(",", "."));
      if(!isNaN(paid) && paid >= total){
        changeBox.hidden = false;
        changeVal.textContent = eur(paid - total);
      } else {
        changeBox.hidden = true;
      }
    };
    input.addEventListener("input", updateChange);
    overlay.querySelector(".confirm-cancel").addEventListener("click", ()=>overlay.remove());
    const submitCash = ()=>{
      const paid = parseFloat((input.value||"").replace(",", "."));
      if(isNaN(paid) || paid < total){
        showToast("Introduce un importe igual o mayor al total");
        return;
      }
      finish("efectivo", paid, paid - total);
    };
    overlay.querySelector(".cash-confirm").addEventListener("click", submitCash);
    input.addEventListener("keydown", (e)=>{ if(e.key === "Enter"){ e.preventDefault(); submitCash(); } });
  });
}

// Selector de opción genérico (refresco de un combinado, o hielo/limón de una bebida):
// muestra una ventana con botones, uno por opción, y ejecuta onPick(index) al elegir.
function openOptionPicker(promptText, options, onPick, noteCallback){
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  const chips = options.map((label, i)=>`<button class="picker-chip" data-idx="${i}">${label}</button>`).join("");
  const variableButton = noteCallback
    ? `<button class="picker-chip picker-variable-btn">Variable</button>`
    : "";
  overlay.innerHTML = `
    <div class="picker-box">
      <p>${promptText}</p>
      <div class="picker-grid">${chips}${variableButton}</div>
      <button class="picker-cancel">${I18N[currentLang].cancel}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector(".picker-cancel").addEventListener("click", ()=>overlay.remove());

  if(noteCallback){
    overlay.querySelector(".picker-variable-btn").addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      overlay.remove();
      noteCallback();
    });
  }

  overlay.querySelectorAll(".picker-chip[data-idx]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const idx = Number(btn.dataset.idx);
      overlay.remove();
      onPick(idx);
    });
  });
}

// Artículo "Variable": nombre y precio libres, para cualquier mesa, sin depender
// de un combinado con mezclador. Se abre con el botón "➕ Variable" de la comanda.
function openVariableItemFlow(){
  const t = I18N[currentLang];
  const nameOverlay = document.createElement("div");
  nameOverlay.className = "confirm-overlay";
  nameOverlay.innerHTML = `
    <div class="note-box">
      <h3>${t.variableBtn}</h3>
      <p>${t.variableNamePrompt}</p>
      <textarea class="note-input" maxlength="60" placeholder="${t.variableNamePlaceholder}"></textarea>
      <div class="note-actions">
        <button class="note-cancel">${t.cancel}</button>
        <button class="note-save">${t.next}</button>
      </div>
    </div>
  `;
  document.body.appendChild(nameOverlay);
  const nameInput = nameOverlay.querySelector(".note-input");
  setTimeout(()=>nameInput.focus(), 50);
  const closeName = ()=>nameOverlay.remove();
  nameOverlay.addEventListener("click", e=>{ if(e.target===nameOverlay) closeName(); });
  nameOverlay.querySelector(".note-cancel").addEventListener("click", closeName);

  const goToPrice = ()=>{
    const name = nameInput.value.trim();
    if(!name) return;
    nameOverlay.remove();

    const priceOverlay = document.createElement("div");
    priceOverlay.className = "confirm-overlay";
    priceOverlay.innerHTML = `
      <div class="note-box">
        <h3>${t.total}</h3>
        <p>${name}</p>
        <input type="number" class="note-input price-input" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
        <div class="note-actions">
          <button class="note-cancel">${t.cancel}</button>
          <button class="note-save">${t.add}</button>
        </div>
      </div>
    `;
    document.body.appendChild(priceOverlay);
    const priceInput = priceOverlay.querySelector(".price-input");
    setTimeout(()=>{ priceInput.focus(); }, 50);
    const closePrice = ()=>priceOverlay.remove();
    priceOverlay.addEventListener("click", e=>{ if(e.target===priceOverlay) closePrice(); });
    priceOverlay.querySelector(".note-cancel").addEventListener("click", closePrice);

    const save = ()=>{
      const raw = priceInput.value.replace(",", ".").trim();
      const parsed = parseFloat(raw);
      const finalPrice = (!isNaN(parsed) && parsed >= 0) ? parsed : 0;
      const variantId = "var-" + Date.now();
      const variant = {
        id: variantId,
        cat: t.variableBtn,
        group: t.variableBtn,
        groupKey: null,
        name: name,
        desc: "",
        price: finalPrice,
        mixers: null,
        extras: null
      };
      FLAT.push(variant);
      writeQty(currentTable, variant.id, 1);
      priceOverlay.remove();
    };
    priceOverlay.querySelector(".note-save").addEventListener("click", save);
    priceInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter"){ e.preventDefault(); save(); } });
  };
  nameOverlay.querySelector(".note-save").addEventListener("click", goToPrice);
  nameInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); goToPrice(); } });
}

  const listHtml = history.length === 0
    ? `<div class="history-empty">${I18N[currentLang].historyEmpty}</div>`

            ${h.items.map(it => `
              <div class="hdet-line">
                <span><span class="q">${it.qty}×</span>${it.name}</span>
                <span>${eur(it.price * it.qty)}</span>
              </div>
            `).join("")}
            <button class="history-reprint" data-hid="${h.id}">🖨️ Reimprimir ticket</button>
          </div>

  overlay.innerHTML = `

    head.addEventListener("click", ()=>{
      head.parentElement.classList.toggle("open");
